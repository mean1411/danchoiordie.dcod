<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DCOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 32px 24px 100px;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 180px;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .menu {
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
        }

        /* INTRO */

        .intro {
            margin-bottom: 180px;
        }

        .intro-title {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #777;
        }

        /* SECTIONS */

        .section {
            margin-bottom: 180px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 32px;
        }

        .list {
            border-top: 1px solid #222;
        }

        .item {
            display: block;
            text-decoration: none;
            color: #fff;
            border-bottom: 1px solid #222;
            padding: 22px 0;
            transition: padding-left 0.2s ease;
        }

        .item:hover {
            padding-left: 10px;
        }

        .number {
            display: inline-block;
            width: 42px;
            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .name {
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* FOOTER */

        .footer {
            color: #444;
            font-size: 9px;
            letter-spacing: 3px;
            padding-top: 20px;
        }

        @media (max-width: 600px) {

            .page {
                padding: 24px 18px 80px;
            }

            .header {
                margin-bottom: 140px;
            }

            .intro {
                margin-bottom: 140px;
            }

            .section {
                margin-bottom: 140px;
            }

            .name {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- HEADER -->

        <header class="header">
            <div class="logo">DCOD</div>
            <div class="menu">MUSIC / ARTS / ARCHIVE</div>
        </header>


        <!-- INTRO -->

        <section class="intro">
            <div class="intro-title">
                MUSIC / ARTS / ARCHIVE
            </div>
        </section>


        <!-- MUSIC -->

        <section class="section">

            <h2 class="section-title">MUSIC</h2>

            <div class="list">

                <a href="music.html" class="item">
                    <span class="number">01</span>
                    <span class="name">BEATS</span>
                </a>

                <a href="music.html" class="item">
                    <span class="number">02</span>
                    <span class="name">RELEASES</span>
                </a>

                <a href="music.html" class="item">
                    <span class="number">03</span>
                    <span class="name">UNRELEASED</span>
                </a>

                <a href="music.html" class="item">
                    <span class="number">04</span>
                    <span class="name">EXCLUSIVE</span>
                </a>

            </div>

        </section>


        <!-- ARTS -->

        <section class="section">

            <h2 class="section-title">ARTS</h2>

            <div class="list">

                <a href="#" class="item">
                    <span class="number">01</span>
                    <span class="name">VISUALS</span>
                </a>

                <a href="#" class="item">
                    <span class="number">02</span>
                    <span class="name">FILMS</span>
                </a>

                <a href="#" class="item">
                    <span class="number">03</span>
                    <span class="name">PICTURES</span>
                </a>

            </div>

        </section>


        <!-- ARCHIVE -->

        <section class="section">

            <h2 class="section-title">ARCHIVE</h2>

            <div class="list">

                <a href="#" class="item">
                    <span class="number">01</span>
                    <span class="name">PROJECTS</span>
                </a>

                <a href="#" class="item">
                    <span class="number">02</span>
                    <span class="name">HISTORY</span>
                </a>

                <a href="#" class="item">
                    <span class="number">03</span>
                    <span class="name">COLLECTION</span>
                </a>

            </div>

        </section>


        <!-- FOOTER -->

        <footer class="footer">
            DCOD — 2026
        </footer>

    </div>

</body>
</html>
