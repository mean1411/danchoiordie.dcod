<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DCOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        main {
            padding: 40px 28px 100px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* TOP */

        .header {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .intro {
            font-size: 12px;
            color: #777;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .scroll {
            margin-top: 100px;
            font-size: 10px;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }


        /* SECTIONS */

        .section {
            padding: 140px 0;
            border-top: 1px solid #181818;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 55px;
            text-transform: uppercase;
        }


        /* ITEMS */

        .item {
            display: flex;
            align-items: baseline;
            gap: 20px;
            padding: 18px 0;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #111;
            transition: opacity 0.2s ease;
        }

        .item:hover {
            opacity: 0.45;
        }

        .number {
            width: 25px;
            color: #444;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .name {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }


        /* FOOTER */

        .footer {
            padding-top: 160px;
            color: #333;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            main {
                padding: 30px 20px 80px;
            }

            .header {
                min-height: 75vh;
            }

            .section {
                padding: 110px 0;
            }

            .section-title {
                margin-bottom: 40px;
            }

            .name {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

<main>

    <!-- INTRO -->

    <section class="header">

        <div class="logo">
            DCOD
        </div>

        <div class="intro">
            MUSIC / ARTS / ARCHIVE
        </div>

        <div class="scroll">
            SCROLL TO EXPLORE
        </div>

    </section>


    <!-- MUSIC -->

    <section class="section">

        <div class="section-title">
            MUSIC
        </div>

        <a href="#" class="item">
            <span class="number">01</span>
            <span class="name">BEATS</span>
        </a>

        <a href="#" class="item">
            <span class="number">02</span>
            <span class="name">RELEASES</span>
        </a>

        <a href="#" class="item">
            <span class="number">03</span>
            <span class="name">UNRELEASED</span>
        </a>

        <a href="#" class="item">
            <span class="number">04</span>
            <span class="name">EXCLUSIVE</span>
        </a>

    </section>


    <!-- ARTS -->

    <section class="section">

        <div class="section-title">
            ARTS
        </div>

        <a href="#" class="item">
            <span class="number">01</span>
            <span class="name">VISUALS</span>
        </a>

        <a href="#" class="item">
            <span class="number">02</span>
            <span class="name">FILMS</span>
        </a>

        <a href="#" class="item">
            <span class="number">03</span>
            <span class="name">PICTURES</span>
        </a>

    </section>


    <!-- ARCHIVE -->

    <section class="section">

        <div class="section-title">
            ARCHIVE
        </div>

        <a href="#" class="item">
            <span class="number">01</span>
            <span class="name">PROJECTS</span>
        </a>

        <a href="#" class="item">
            <span class="number">02</span>
            <span class="name">HISTORY</span>
        </a>

        <a href="#" class="item">
            <span class="number">03</span>
            <span class="name">COLLECTION</span>
        </a>

    </section>


    <!-- FOOTER -->

    <div class="footer">
        DCOD — MUSIC / ARTS / ARCHIVE
    </div>

</main>

</body>
</html>
