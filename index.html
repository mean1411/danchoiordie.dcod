<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DCOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            padding: 32px 24px;
        }

        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .menu {
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* INTRO */

        .intro {
            min-height: 85vh;
            display: flex;
            align-items: center;
        }

        .intro-text {
            font-size: 12px;
            color: #777;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* SECTIONS */

        section {
            margin-bottom: 180px;
        }

        .section-title {
            font-size: 12px;
            color: #777;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .list {
            border-top: 1px solid #222;
        }

        .item {
            display: flex;
            align-items: baseline;
            gap: 28px;

            padding: 18px 0;

            border-bottom: 1px solid #222;

            color: #fff;
            text-decoration: none;

            transition: all 0.2s ease;
        }

        .item:hover {
            padding-left: 8px;
        }

        .number {
            width: 24px;
            color: #444;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .name {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        /* FOOTER */

        footer {
            padding: 80px 0 30px;
            color: #444;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 24px 18px;
            }

            .intro {
                min-height: 80vh;
            }

            section {
                margin-bottom: 140px;
            }

            .item {
                padding: 16px 0;
            }

            .name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="logo">DCOD</div>
        <div class="menu">MUSIC / ARTS / ARCHIVE</div>
    </header>


    <!-- INTRO -->

    <div class="intro">
        <div class="intro-text">
            Music / Arts / Archive
        </div>
    </div>


    <!-- MUSIC -->

    <section>

        <div class="section-title">
            Music
        </div>

        <div class="list">

            <a href="#" class="item">
                <span class="number">01</span>
                <span class="name">Beats</span>
            </a>

            <a href="#" class="item">
                <span class="number">02</span>
                <span class="name">Releases</span>
            </a>

            <a href="#" class="item">
                <span class="number">03</span>
                <span class="name">Unreleased</span>
            </a>

            <a href="#" class="item">
                <span class="number">04</span>
                <span class="name">Exclusive</span>
            </a>

        </div>

    </section>


    <!-- ARTS -->

    <section>

        <div class="section-title">
            Arts
        </div>

        <div class="list">

            <a href="#" class="item">
                <span class="number">01</span>
                <span class="name">Visuals</span>
            </a>

            <a href="#" class="item">
                <span class="number">02</span>
                <span class="name">Films</span>
            </a>

            <a href="#" class="item">
                <span class="number">03</span>
                <span class="name">Pictures</span>
            </a>

        </div>

    </section>


    <!-- ARCHIVE -->

    <section>

        <div class="section-title">
            Archive
        </div>

        <div class="list">

            <a href="#" class="item">
                <span class="number">01</span>
                <span class="name">Projects</span>
            </a>

            <a href="#" class="item">
                <span class="number">02</span>
                <span class="name">History</span>
            </a>

            <a href="#" class="item">
                <span class="number">03</span>
                <span class="name">Collection</span>
            </a>

        </div>

    </section>


    <footer>
        DCOD — Digital Archive
    </footer>

</div>

</body>
</html>
