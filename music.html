<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSIC — DCOD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .page {
            padding: 32px 24px 80px;
            max-width: 1000px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 120px;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .back {
            color: #777;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .back:hover {
            color: #fff;
        }

        .title {
            font-size: clamp(60px, 15vw, 150px);
            font-weight: 700;
            letter-spacing: -7px;
            line-height: 0.8;
            margin-bottom: 100px;
        }

        .music-list {
            border-top: 1px solid #222;
        }

        .music-item {
            display: block;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #222;
            padding: 28px 0;
            transition: padding 0.2s ease;
        }

        .music-item:hover {
            padding-left: 12px;
        }

        .number {
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
        }

        .name {
            font-size: clamp(28px, 6vw, 52px);
            font-weight: 500;
            letter-spacing: -2px;
        }

        .description {
            color: #666;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .footer {
            margin-top: 120px;
            color: #444;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="top">
            <div class="logo">DCOD</div>

            <a href="index.html" class="back">
                ← Back
            </a>
        </div>


        <h1 class="title">MUSIC</h1>


        <div class="music-list">

            <a href="#" class="music-item">
                <span class="number">01</span>
                <div class="name">BEATS</div>
                <div class="description">
                    Instrumentals / Production
                </div>
            </a>


            <a href="#" class="music-item">
                <span class="number">02</span>
                <div class="name">RELEASES</div>
                <div class="description">
                    Official Music
                </div>
            </a>


            <a href="#" class="music-item">
                <span class="number">03</span>
                <div class="name">UNRELEASED</div>
                <div class="description">
                    Music Not Available Elsewhere
                </div>
            </a>


            <a href="#" class="music-item">
                <span class="number">04</span>
                <div class="name">EXCLUSIVE</div>
                <div class="description">
                    Only Available Here
                </div>
            </a>

        </div>


        <div class="footer">
            DCOD — MUSIC ARCHIVE
        </div>

    </div>

</body>
</html>
